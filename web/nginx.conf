server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 上游还有一层反向代理负责 HTTPS 与 HSTS
    server_tokens off;

    # 涉及人脸数据的内部工具，不希望被收录
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    # 前端不加载任何第三方资源，CSP 可以收得很紧
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;

    # 构建产物带 hash，可以永久缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 必须用 set 而非 add：X-Forwarded-For 可被客户端伪造，
        # api 侧的限流依赖这个头的第一段，追加会让伪造值排在真实 IP 前面。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 自拍上传：与 api 的 MAX_UPLOAD_BYTES 保持一致（3 张 × 10MB + 余量）
        client_max_body_size 32m;
        # 人脸推理可能要几秒，别让 nginx 先超时
        proxy_read_timeout 120s;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
        # index.html 不能缓存，否则发版后用户拿到旧的 asset 引用
        add_header Cache-Control "no-cache";
    }
}
