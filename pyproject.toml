# 全 Python 组件（api / jobs / libs / embedding）共用一套 lint 与类型检查配置。

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["libs", "api", "jobs", "embedding"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "TID", "RUF", "ASYNC", "S"]
ignore = [
    "S101",  # pytest 里到处是 assert
    # 本项目的注释与 docstring 用中文，全角标点是正常的而不是「歧义字符」。
    # 这三条规则会对每一个中文标点报错，必须关掉。
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106"]

[tool.ruff.lint.isort]
# 否则 `api` / `jobs` / `gallery_core` 会被当成第三方包，import 分组混乱
known-first-party = ["api", "jobs", "embedding", "gallery_core"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = []
# 第三方库缺 stub 的不阻塞
[[tool.mypy.overrides]]
module = ["insightface.*", "cv2.*", "hdbscan.*", "sklearn.*", "onnxruntime.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["api/tests", "jobs/tests", "libs/tests"]
filterwarnings = ["error::DeprecationWarning"]
