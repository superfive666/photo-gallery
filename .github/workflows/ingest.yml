name: Ingest

# 定时增量建库。跑在生产机（.12）上：需要访问生产数据库、GPU 上的 embedding 服务与源站。
on:
  schedule:
    # ⚠️ cron 是 UTC。这里是新加坡时间次日 02:00（UTC+8）。
    # 改时间时记得换算，这是最常踩的坑。
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      album:
        description: 'album id，留空则处理全部相册'
        required: false
        type: string
      full:
        description: '全量重跑（忽略 checksum 缓存）'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# 建库不允许并发：两个 ingest 同时跑会互相争抢 embedding 服务并产生冗余下载。
concurrency:
  group: ingest-production
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: [self-hosted, linux, x64, zrc-prod]
    if: github.repository == 'superfive666/photo-gallery'
    # 大相册全量重跑可能要几小时
    timeout-minutes: 480

    env:
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/opt/photo-gallery' }}

    steps:
      # 不需要仓库代码 —— 用的是**当前已部署**那个版本的镜像，而不是 HEAD。
      # checkout 只为了给 upload-artifact 一个存在的工作区。
      - uses: actions/checkout@v4

      # 用**已部署**的 tag，不用 latest：latest 可能已经指向一个还没上线的构建，
      # 那会让定时任务偷偷跑上一个未经部署验证的版本。
      - name: 取当前已部署的镜像 tag
        run: |
          set -eu
          cd "$DEPLOY_DIR"
          test -f .deployed-tag || { echo "::error::还没有成功部署过，先跑 Deploy"; exit 1; }
          echo "IMAGE_TAG=$(cat .deployed-tag)" >> "$GITHUB_ENV"

      - name: 确认服务在运行
        run: |
          set -eu
          cd "$DEPLOY_DIR"
          docker compose up -d db embedding
          # embedding 加载模型需要时间，等它 healthy 再开始
          for _ in $(seq 1 30); do
            status=$(docker compose ps -q embedding | xargs docker inspect -f '{{.State.Health.Status}}')
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::embedding 服务未就绪"
          exit 1

      - name: 建库
        id: ingest
        run: |
          args=""
          if [ -n "${{ inputs.album }}" ]; then args="$args --album ${{ inputs.album }}"; fi
          if [ "${{ inputs.full }}" = "true" ]; then args="$args --full"; fi
          cd "$DEPLOY_DIR"
          docker compose run --rm jobs python -m jobs ingest $args \
            | tee "$GITHUB_WORKSPACE/ingest-report.json"

      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingest-report-${{ github.run_number }}
          path: ingest-report.json
          retention-days: 30
          if-no-files-found: warn
