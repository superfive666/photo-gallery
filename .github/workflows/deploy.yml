name: Deploy

# 自建 runner。只由 main 分支的 push 和手动触发驱动 —— 绝不接受 pull_request。
# fork 的 PR 永远不该在家用机器上执行代码。见 docs/cicd.md 的安全前提。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# 部署不允许并发：两个部署同时改数据库和容器状态会互相踩。
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # 用标签精确选中生产机，避免误跑到别的自建 runner 上
    runs-on: [self-hosted, linux, x64, zrc-prod]

    # 双保险：即使有人误加了 pull_request 触发，来自 fork 的事件也会在这里被拦掉
    if: github.repository == 'superfive666/photo-gallery' && github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: 确认 .env 就位
        run: |
          # 生产 .env 存在服务器上，不经过 GitHub。缺失就中止，别用默认密码起服务。
          test -f .env || { echo "服务器上缺少 .env"; exit 1; }
          # 权限必须是 600
          perms=$(stat -c "%a" .env)
          test "$perms" = "600" || { echo ".env 权限是 $perms，应为 600"; exit 1; }

      - name: 记录当前镜像用于回滚
        run: |
          # 给当前运行的镜像打一个 rollback tag。失败时直接用这些 tag 重启即可，
          # 不需要在 workflow 里传递 image id。
          for svc in api web embedding; do
            id=$(docker compose images -q "$svc" 2>/dev/null || true)
            if [ -n "$id" ]; then
              docker tag "$id" "photo-gallery-rollback-$svc:previous"
              echo "已标记 $svc 的回滚镜像"
            else
              echo "$svc 当前未运行（首次部署），无回滚目标"
            fi
          done

      - name: 构建镜像
        run: docker compose build

      # 迁移必须在新代码启动之前。DDL 只做向后兼容的新增，所以旧代码在这个窗口期
      # 仍能正常工作。反过来（先换代码后迁移）会有一段新代码访问不存在列的时间。
      - name: 执行数据库迁移
        run: docker compose run --rm jobs python -m jobs migrate

      - name: 滚动重启
        run: docker compose up -d --no-deps embedding api web

      - name: 健康检查
        id: health
        run: |
          for attempt in $(seq 1 30); do
            if docker compose exec -T api python -c "
          import sys, urllib.request
          try:
              r = urllib.request.urlopen('http://localhost:8000/readyz', timeout=5)
              sys.exit(0 if r.status == 200 else 1)
          except Exception:
              sys.exit(1)
          "; then
              echo "就绪检查通过（第 $attempt 次）"
              exit 0
            fi
            sleep 5
          done
          echo "::error::健康检查在 150 秒内未通过"
          exit 1

      - name: 失败则回滚
        if: failure() && steps.health.outcome == 'failure'
        run: |
          echo "::warning::健康检查未通过，回滚到上一组镜像"
          # 只回滚镜像，不回滚数据库 —— DDL 是向后兼容的新增，旧代码在新 schema 上能正常工作。
          # 这正是「先迁移、后换代码」这个顺序换来的好处。
          missing=0
          for svc in api web embedding; do
            if ! docker image inspect "photo-gallery-rollback-$svc:previous" >/dev/null 2>&1; then
              echo "::error::$svc 没有可回滚的镜像（可能是首次部署）"
              missing=1
              continue
            fi
            # compose 用 build 出的镜像名，这里直接覆盖同名 tag 后重启
            docker tag "photo-gallery-rollback-$svc:previous" "photo-gallery-$svc:latest"
          done
          if [ "$missing" = "1" ]; then
            echo "::error::回滚不完整，需要人工介入"
            exit 1
          fi
          docker compose up -d --no-deps --force-recreate embedding api web
          # 无论回滚是否成功，这次部署都算失败
          exit 1

      - name: 清理悬空镜像
        if: always()
        # 家用机器磁盘有限，每次部署都会留下旧镜像层
        run: docker image prune -f --filter "until=168h"
