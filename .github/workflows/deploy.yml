name: Deploy

# 两台自建 runner：
#   build  → zrc-ci   (192.168.0.15, 无 GPU) 构建镜像并推 Docker Hub 私有仓库
#   deploy → zrc-prod (192.168.0.12, 有 GPU) 只 pull / migrate / up，从不构建
# 构建机永不接触 .env 和生产数据库；生产机永不执行测试代码。见 docs/deployment.md。
#
# Docker Hub 的凭据不放 GitHub Secrets：两台机器各自 `docker login` 一次
# （.15 用读写 token，.12 用只读 token），凭据留在机器上不经过 CI 平台。
#
# 只由 main 分支的 push 和手动触发驱动 —— 绝不接受 pull_request。
# fork 的 PR 永远不该在家用机器上执行代码。见 docs/cicd.md 的安全前提。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 部署不允许并发：两个部署同时改数据库和容器状态会互相踩。
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # Docker Hub 私有仓库的前缀。四个服务是四个仓库：<prefix>-api、-jobs、-web、-embedding。
  # 仓库 Variables 里设 IMAGE_PREFIX 可覆盖（换 GHCR 或内网 registry 只改这一个值）。
  IMAGE_PREFIX: ${{ vars.IMAGE_PREFIX || 'superfive666/photo-gallery' }}

jobs:
  build:
    name: 构建并推镜像（.15）
    runs-on: [self-hosted, linux, x64, zrc-ci]

    # 双保险：即使有人误加了 pull_request 触发，来自 fork 的事件也会在这里被拦掉
    if: github.repository == 'superfive666/photo-gallery' && github.event_name != 'pull_request'

    outputs:
      tag: ${{ steps.meta.outputs.tag }}

    env:
      # 唯一的部署目标有 GPU，所以只构建 GPU 变体。
      # onnxruntime-gpu 在没有 CUDA 的机器上也能 import，providers 里有 CPU 兜底。
      EMBEDDING_GPU: 'true'
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || '/api' }}

    steps:
      - uses: actions/checkout@v4

      - name: 计算镜像 tag
        id: meta
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # 凭据是机器上 `docker login` 存下来的，不经过 GitHub。这里只做存在性检查 ——
      # 否则 token 被撤销时会在 push 那一步报一句难以定位的 401。
      - name: 确认已登录 Docker Hub
        run: |
          set -eu
          grep -q 'index.docker.io' "$HOME/.docker/config.json" 2>/dev/null || {
            echo "::error::这台机器还没登录 Docker Hub。以 runner 账户执行："
            echo "::error::  echo <token> | docker login -u <用户名> --password-stdin"
            echo "::error::见 docs/deployment.md 1.3"
            exit 1
          }

      # tools profile 把一次性容器 jobs 也带进来 —— 迁移要用它
      - name: 构建
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
        run: docker compose --profile tools build

      # 逐个 push 而不是 `docker compose push`：后者会把 db 的上游镜像
      # （pgvector/pgvector）也一并尝试推送，那是别人的 repository，必然失败。
      #
      # 第一次 push 会把 GB 级的 embedding 镜像整个传上去，家宽上行会疼一次。
      # 之后只传变化的层 —— onnxruntime-gpu 与模型权重在依赖层里，改业务代码不动它们。
      - name: 推到 Docker Hub
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -eu
          for svc in api jobs web embedding; do
            docker push "$IMAGE_PREFIX-$svc:$IMAGE_TAG"
            # 同时推一个 latest，方便人工排查时不用记 sha
            docker tag "$IMAGE_PREFIX-$svc:$IMAGE_TAG" "$IMAGE_PREFIX-$svc:latest"
            docker push "$IMAGE_PREFIX-$svc:latest"
          done

      - name: 清理悬空镜像
        if: always()
        # 构建机磁盘会被历史层吃满，尤其是 GB 级的 embedding 镜像
        run: docker image prune -f --filter "until=72h"

  deploy:
    name: 部署（.12）
    needs: build
    runs-on: [self-hosted, linux, x64, zrc-prod]

    env:
      # 生产状态目录：.env、compose 文件、schema、上次部署的 tag 都在这里。
      # ⚠️ 绝不能用 runner 的工作区 —— actions/checkout 会 git clean -ffdx，
      # 连 gitignore 的 .env 一起删掉，第二次部署就会带着默认密码起服务。
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/opt/photo-gallery' }}
      IMAGE_TAG: ${{ needs.build.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: 检查生产目录与 .env
        run: |
          set -eu
          test -d "$DEPLOY_DIR" || { echo "::error::$DEPLOY_DIR 不存在，先按 docs/deployment.md 初始化生产机"; exit 1; }
          # 生产 .env 只存在于这台机器上，不经过 GitHub。缺失就中止，别用默认密码起服务。
          test -f "$DEPLOY_DIR/.env" || { echo "::error::缺少 $DEPLOY_DIR/.env"; exit 1; }
          perms=$(stat -c "%a" "$DEPLOY_DIR/.env")
          test "$perms" = "600" || { echo "::error::.env 权限是 $perms，应为 600"; exit 1; }

      # compose 文件与迁移 SQL 从仓库同步过去；.env 与数据卷留在原地不动。
      - name: 同步 compose 与 schema
        run: |
          set -eu
          install -m 644 docker-compose.yml docker-compose.gpu.yml "$DEPLOY_DIR/"
          mkdir -p "$DEPLOY_DIR/docs"
          rm -rf "$DEPLOY_DIR/docs/schema"
          cp -r docs/schema "$DEPLOY_DIR/docs/schema"

      # 私有仓库，拉取也要凭据。这台机器上的 token 应该是**只读**的。
      - name: 确认已登录 Docker Hub
        run: |
          set -eu
          grep -q 'index.docker.io' "$HOME/.docker/config.json" 2>/dev/null || {
            echo "::error::这台机器还没登录 Docker Hub，见 docs/deployment.md 2.4"
            exit 1
          }

      - name: 拉取镜像
        run: |
          cd "$DEPLOY_DIR"
          docker compose --profile tools pull

      # 迁移必须在新代码启动之前。DDL 只做向后兼容的新增，所以旧代码在这个窗口期
      # 仍能正常工作。反过来（先换代码后迁移）会有一段新代码访问不存在列的时间。
      - name: 执行数据库迁移
        run: |
          cd "$DEPLOY_DIR"
          docker compose up -d db
          docker compose run --rm jobs python -m jobs migrate

      - name: 滚动重启
        id: restart
        run: |
          cd "$DEPLOY_DIR"
          docker compose up -d --no-deps embedding api web

      - name: 健康检查
        id: health
        run: |
          cd "$DEPLOY_DIR"
          for attempt in $(seq 1 30); do
            if docker compose exec -T api python -c "
          import sys, urllib.request
          try:
              r = urllib.request.urlopen('http://localhost:8000/readyz', timeout=5)
              sys.exit(0 if r.status == 200 else 1)
          except Exception:
              sys.exit(1)
          "; then
              echo "就绪检查通过（第 $attempt 次）"
              exit 0
            fi
            sleep 5
          done
          echo "::error::健康检查在 150 秒内未通过"
          exit 1

      - name: 记录本次已知良好的 tag
        run: |
          cd "$DEPLOY_DIR"
          echo "$IMAGE_TAG" > .deployed-tag
          echo "已部署 $IMAGE_TAG"

      # 只在「已经动过运行中的容器」之后才回滚。
      # 前面几步（校验 .env、pull、migrate）失败时旧版本还在正常服务，
      # 这时候 force-recreate 一遍只会白白中断一次服务。
      - name: 失败则回滚
        if: failure() && (steps.restart.outcome == 'failure' || steps.health.outcome == 'failure')
        run: |
          set -eu
          cd "$DEPLOY_DIR"
          # 只回滚镜像，不回滚数据库 —— DDL 是向后兼容的新增，旧代码在新 schema 上能正常工作。
          # 这正是「先迁移、后换代码」这个顺序换来的好处。
          if [ ! -f .deployed-tag ]; then
            echo "::error::没有上一次成功部署的记录（首次部署？），需要人工介入"
            exit 1
          fi
          prev=$(cat .deployed-tag)
          echo "::warning::健康检查未通过，回滚到 $prev"
          IMAGE_TAG="$prev" docker compose up -d --no-deps --force-recreate embedding api web
          # 无论回滚是否成功，这次部署都算失败
          exit 1

      - name: 清理悬空镜像
        if: always()
        # 家用机器磁盘有限，每次部署都会留下旧镜像层。
        # until=168h：保证至少一周内的版本还能直接换 tag 回滚，不用重新拉。
        run: docker image prune -f --filter "until=168h"
