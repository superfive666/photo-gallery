name: Deploy

# 在生产机（192.168.0.12，label `superfive-ubuntu`）上就地构建并部署。
# 没有镜像仓库：构建产物就留在这台机器的 docker 里，用 tag 区分版本，
# 回滚就是用上一个 tag 重新 up —— 旧镜像还在本地（prune 保留一周）。
#
# 只由 main 分支的 push 和手动触发驱动 —— 绝不接受 pull_request。
# fork 的 PR 永远不该在家用机器上执行代码。见 docs/cicd.md 的安全前提。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 部署不允许并发：两个部署同时改数据库和容器状态会互相踩。
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: 构建并部署（.12）
    # 用 label 精确选中生产机。注意这里匹配的是 runner 的 **label** 而不是 name，
    # 注册时要 --labels superfive-ubuntu。
    # 不写 x64：两台机器架构不同（.15 是 arm64 的 Pi），把架构写进 runs-on 只会
    # 在选错机器时表现为「永远 Queued」。用一个唯一 label 定位更直接。
    runs-on: [self-hosted, linux, superfive-ubuntu]

    # 双保险：即使有人误加了 pull_request 触发，来自 fork 的事件也会在这里被拦掉
    if: github.repository == 'superfive666/photo-gallery' && github.event_name != 'pull_request'

    env:
      # 生产状态目录：.env、compose 文件、schema、上次部署的 tag 都在这里。
      # ⚠️ 绝不能用 runner 的工作区 —— actions/checkout 会 git clean -ffdx，
      # 连 gitignore 的 .env 一起删掉，第二次部署就会带着默认密码起服务。
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/opt/photo-gallery' }}
      # 镜像只存在于本机，不推任何仓库
      IMAGE_PREFIX: photo-gallery
      # 这台机器有 GPU：把已锁定的 CPU 版 onnxruntime 换成同版本的 GPU 版
      EMBEDDING_GPU: 'true'
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || '/api' }}

    steps:
      - uses: actions/checkout@v4

      - name: 计算镜像 tag
        run: echo "IMAGE_TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: 检查生产目录与 .env
        run: |
          set -eu
          test -d "$DEPLOY_DIR" || { echo "::error::$DEPLOY_DIR 不存在，先按 docs/deployment.md 初始化生产机"; exit 1; }
          # 生产 .env 只存在于这台机器上，不经过 GitHub。缺失就中止，别用默认密码起服务。
          test -f "$DEPLOY_DIR/.env" || { echo "::error::缺少 $DEPLOY_DIR/.env"; exit 1; }
          perms=$(stat -c "%a" "$DEPLOY_DIR/.env")
          test "$perms" = "600" || { echo "::error::.env 权限是 $perms，应为 600"; exit 1; }

      # 构建在工作区里做（build context 需要源码），但读的是生产 .env ——
      # 否则 compose 插值会把一堆变量解析成空串，只给一串 warning。
      # tools profile 把一次性容器 jobs 也带进来，迁移要用它。
      - name: 构建镜像
        run: docker compose --env-file "$DEPLOY_DIR/.env" --profile tools build

      # compose 文件与迁移 SQL 从仓库同步过去；.env 与数据卷留在原地不动。
      - name: 同步 compose 与 schema
        run: |
          set -eu
          install -m 644 docker-compose.yml docker-compose.gpu.yml "$DEPLOY_DIR/"
          mkdir -p "$DEPLOY_DIR/docs"
          rm -rf "$DEPLOY_DIR/docs/schema"
          cp -r docs/schema "$DEPLOY_DIR/docs/schema"

      # 迁移必须在新代码启动之前。DDL 只做向后兼容的新增，所以旧代码在这个窗口期
      # 仍能正常工作。反过来（先换代码后迁移）会有一段新代码访问不存在列的时间。
      # 数据库是宿主机上的 Postgres（不在 compose 里），jobs 容器经
      # host.docker.internal 连它 —— 连不上就查 listen_addresses / pg_hba / ufw，
      # 见 docs/deployment.md。
      - name: 执行数据库迁移
        run: |
          cd "$DEPLOY_DIR"
          docker compose run --rm jobs python -m jobs migrate

      - name: 滚动重启
        id: restart
        run: |
          cd "$DEPLOY_DIR"
          docker compose up -d --no-deps embedding api web worker

      - name: 健康检查
        id: health
        run: |
          cd "$DEPLOY_DIR"
          for attempt in $(seq 1 30); do
            if docker compose exec -T api python -c "
          import sys, urllib.request
          try:
              r = urllib.request.urlopen('http://localhost:8000/readyz', timeout=5)
              sys.exit(0 if r.status == 200 else 1)
          except Exception:
              sys.exit(1)
          "; then
              echo "就绪检查通过（第 $attempt 次）"
              exit 0
            fi
            sleep 5
          done
          echo "::error::健康检查在 150 秒内未通过"
          exit 1

      - name: 记录本次已知良好的 tag
        run: |
          set -eu
          cd "$DEPLOY_DIR"
          # 上一个在线版本是回滚目标，记下来供清理步骤保留
          if [ -f .deployed-tag ] && [ "$(cat .deployed-tag)" != "$IMAGE_TAG" ]; then
            cp .deployed-tag .previous-tag
          fi
          echo "$IMAGE_TAG" > .deployed-tag
          # 同时写进 .env：让人工手敲的 docker compose 命令（up / run / ps）
          # 默认就指向当前在线的版本。不写的话 .env 里残留的 IMAGE_TAG=dev 会让
          # compose 去找不存在的 :dev 镜像，进而在没有源码的生产目录里试图构建。
          # 部署与回滚不受影响：workflow 的进程环境变量优先于 .env 文件。
          if grep -q '^IMAGE_TAG=' .env; then
            sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=$IMAGE_TAG|" .env
          else
            echo "IMAGE_TAG=$IMAGE_TAG" >> .env
          fi
          echo "已部署 $IMAGE_TAG"

      # ⚠️ 必须在回滚**之前**抓：回滚会重建容器抹掉崩溃日志，清理会删掉失败镜像 ——
      # 不抓的话「新版本为什么起不来」就永远无从知晓（真发生过，排查绕了三轮）。
      - name: 失败时抓取容器日志
        if: failure() && (steps.restart.outcome == 'failure' || steps.health.outcome == 'failure')
        run: |
          cd "$DEPLOY_DIR"
          echo "================ embedding 容器日志 ================"
          docker compose logs --no-color --tail=120 embedding || true
          echo "================ api 容器日志 ================"
          docker compose logs --no-color --tail=40 api || true

      # 只在「已经动过运行中的容器」之后才回滚。
      # 前面几步（校验 .env、构建、migrate）失败时旧版本还在正常服务，
      # 这时候 force-recreate 一遍只会白白中断一次服务。
      - name: 失败则回滚
        if: failure() && (steps.restart.outcome == 'failure' || steps.health.outcome == 'failure')
        run: |
          set -eu
          cd "$DEPLOY_DIR"
          # 只回滚镜像，不回滚数据库 —— DDL 是向后兼容的新增，旧代码在新 schema 上能正常工作。
          # 这正是「先迁移、后换代码」这个顺序换来的好处。
          if [ ! -f .deployed-tag ]; then
            echo "::error::没有上一次成功部署的记录（首次部署？），需要人工介入"
            exit 1
          fi
          prev=$(cat .deployed-tag)
          # 上一个版本的镜像还在本机（没有仓库可拉，所以这一步依赖 prune 的保留窗口）
          if ! docker image inspect "$IMAGE_PREFIX-api:$prev" >/dev/null 2>&1; then
            echo "::error::本机已经没有 $prev 的镜像了（被 prune 清掉？），需要人工介入"
            exit 1
          fi
          echo "::warning::健康检查未通过，回滚到 $prev"
          IMAGE_TAG="$prev" docker compose up -d --no-deps --force-recreate embedding api web worker
          # 无论回滚是否成功，这次部署都算失败
          exit 1

      # ⚠️ 不能用 `docker image prune --filter until=…`：它只删「悬空（无 tag）」
      # 镜像，带 sha- tag 的旧版本一个都不会碰 —— embedding 单个 5.5GB，
      # 堆几次部署磁盘就满了（生产上真堆出过 3 份）。改为按数量保留：
      # 只留当前在线（.deployed-tag）与上一个（.previous-tag，回滚目标）。
      - name: 清理旧版本镜像
        if: always()
        run: |
          set -eu
          cd "$DEPLOY_DIR"
          keep1="$(cat .deployed-tag 2>/dev/null || true)"
          keep2="$(cat .previous-tag 2>/dev/null || true)"
          echo "保留: $keep1 $keep2"
          for svc in api jobs web embedding; do
            docker images --format '{{.Repository}}:{{.Tag}}' "$IMAGE_PREFIX-$svc" \
            | while read -r img; do
                tag="${img##*:}"
                case "$tag" in "<none>"|"$keep1"|"$keep2") continue ;; esac
                # 正被容器使用的镜像 rmi 会拒绝删除，跳过即可
                docker rmi "$img" >/dev/null 2>&1 && echo "已删除 $img" || echo "跳过 $img（使用中）"
              done
          done
          # 重建同名 tag 时旧层会变成悬空镜像，一并清掉
          docker image prune -f >/dev/null
          # buildkit 构建缓存单独设上限。别清太狠：CUDA 轮子与模型权重的缓存层
          # 正是「改业务代码时构建只要几十秒而不是二十分钟」的原因。
          docker builder prune -f --keep-storage 20g >/dev/null 2>&1 || true
          docker system df
