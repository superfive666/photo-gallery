name: CI

# ⚠️ 这个 workflow 必须跑在 GitHub 托管 runner 上。
# 自建 runner 只用于构建与部署（deploy.yml / ingest.yml），绝不用于 PR 的 CI ——
# 否则 fork 提的 PR 就能在自建机器上执行任意代码。见 docs/cicd.md。
#
# 换句话说：自建 runner 上只执行部署分支上的构建与部署步骤，不跑测试代码、
# 不装 npm 依赖。「家里的机器上有 runner」不等于「什么都可以在上面跑」。
#
# 另外 .15 是 arm64 的 Pi 5，insightface 没有 arm64 预编译 wheel，
# 这个 job 搬过去大概率要从源码编译 —— 不值当。
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: photo_gallery_test
          POSTGRES_USER: gallery
          POSTGRES_PASSWORD: test-password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://gallery:test-password@localhost:5432/photo_gallery_test
    steps:
      - uses: actions/checkout@v4

      # uv 版本钉死，与 Dockerfile 里的一致 —— 它决定 uv.lock 的解读方式
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.8.17'
          enable-cache: true

      # --frozen：uv.lock 与 pyproject 不一致就直接失败。
      # 这一步同时起到「有人改了依赖但忘记提交 uv.lock」的守卫作用。
      - name: 安装依赖
        run: uv sync --all-packages --frozen

      - name: ruff
        run: |
          uv run ruff check api jobs libs embedding
          uv run ruff format --check api jobs libs embedding

      - name: mypy
        run: uv run mypy api jobs libs embedding

      - name: 迁移能跑通
        run: uv run python -m jobs migrate

      - name: pytest
        run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖
        run: npm ci || npm install

      - name: typecheck
        run: npx tsc --noEmit

      - name: eslint
        run: npm run lint

      - name: prettier
        run: npx prettier --check "src/**/*.{ts,tsx,css}"

      - name: vitest
        run: npm run test -- --run

      - name: build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # embedding 不在这里构建：它要下载 300MB 模型权重，每个 PR 都跑太浪费。
        # 由 deploy.yml 在 main 上构建，或按 paths 过滤单独触发。
        service: [api, jobs, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.service }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
