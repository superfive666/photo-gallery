# Dockerfile 全部在 docker/ 下，见 docker/README.md
name: photo-gallery

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 不映射到宿主机：数据库只应在 compose 内网可达。
    # 本地调试临时需要时，用 `docker compose port db 5432` 或临时加 ports。
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  embedding:
    build:
      context: .
      dockerfile: docker/Dockerfile.embedding
      args:
        # true 时把已锁定的 CPU 版 onnxruntime 换成同版本的 onnxruntime-gpu，
        # 同时要设 EMBEDDING_USE_GPU=true 并给容器挂上 GPU。见 docker/README.md。
        EMBEDDING_GPU: ${EMBEDDING_GPU:-false}
    restart: unless-stopped
    environment:
      MODEL_NAME: ${MODEL_NAME}
      MODEL_VERSION: ${MODEL_VERSION}
      ORT_NUM_THREADS: ${ORT_NUM_THREADS}
      MIN_DET_SCORE: ${MIN_DET_SCORE}
      MIN_FACE_PX: ${MIN_FACE_PX}
      EMBEDDING_USE_GPU: ${EMBEDDING_USE_GPU:-false}
      REC_BATCH_SIZE: ${REC_BATCH_SIZE:-64}
      MAX_BATCH_IMAGES: ${MAX_BATCH_IMAGES:-32}
      LOG_LEVEL: ${LOG_LEVEL}
    expose:
      - "8000"
    # 推理是 CPU 密集的，限额避免它把整台机器吃满导致 api 无响应
    deploy:
      resources:
        limits:
          cpus: "${EMBEDDING_CPU_LIMIT:-4}"
          memory: 8g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=5).status==200 else 1)"]
      interval: 15s
      timeout: 10s
      retries: 5
      # 模型加载需要时间，给足启动期
      start_period: 90s

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    env_file: .env
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      embedding:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=5).status==200 else 1)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    restart: unless-stopped
    ports:
      # 生产环境前面还有一层反向代理负责 HTTPS
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

  # 一次性容器：不随 `up` 启动，由 `docker compose run --rm jobs ...` 或 CI 触发
  jobs:
    build:
      context: .
      dockerfile: docker/Dockerfile.jobs
    profiles: ["tools"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # 迁移脚本从这里读，改 SQL 无需重建镜像
      - ./docs/schema:/app/docs/schema:ro
      # local_dir adapter 与评估集的输入目录
      - ${SOURCE_LOCAL_DIR:-./sample-albums}:/data/sample-albums:ro
      - ${EVAL_DIR:-./eval}:/data/eval:ro
      # 原图不落盘：批量推理把字节留在内存里，处理完即释放。所以这里没有原图缓存卷。

volumes:
  pgdata:
