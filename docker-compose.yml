# Dockerfile 全部在 docker/ 下，见 docker/README.md
name: photo-gallery

# 四个可构建服务都显式声明 image，而不是让 compose 用默认名：
#   本地开发   photo-gallery-api:dev
#   生产部署   photo-gallery-api:sha-abc1234
#
# 没有镜像仓库 —— 构建就在部署的那台机器上做（见 docs/deployment.md）。
# 显式 tag 的作用是**回滚**：上一个版本的镜像还在本机，换个 IMAGE_TAG 重新 up 即可。
# 用 compose 的默认名（都叫 :latest）就没有这个能力。
#
# 以后想引入仓库，只改 IMAGE_PREFIX 一个变量（GHCR 三级路径、Docker Hub 两级
# 加 `-<svc>` 后缀都能拼出来），workflow 不用动。

# ⚠️ 数据库不在这里。生产连的是宿主机上已有的 Postgres（DATABASE_URL 指向
# host.docker.internal，见 docs/deployment.md）；本地开发想要容器化 pg 的话，
# 叠加 docker-compose.localdb.yml（.env.example 的 COMPOSE_FILE 默认就带了它）。

services:
  embedding:
    image: ${IMAGE_PREFIX:-photo-gallery}-embedding:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: docker/Dockerfile.embedding
      args:
        # true 时把已锁定的 CPU 版 onnxruntime 换成同版本的 onnxruntime-gpu，
        # 同时要设 EMBEDDING_USE_GPU=true 并给容器挂上 GPU。见 docker/README.md。
        # CI 构建固定为 true（唯一的部署目标有 GPU），本地默认 false。
        EMBEDDING_GPU: ${EMBEDDING_GPU:-false}
    restart: unless-stopped
    environment:
      MODEL_NAME: ${MODEL_NAME}
      MODEL_VERSION: ${MODEL_VERSION}
      ORT_NUM_THREADS: ${ORT_NUM_THREADS}
      MIN_DET_SCORE: ${MIN_DET_SCORE}
      MIN_FACE_PX: ${MIN_FACE_PX}
      EMBEDDING_USE_GPU: ${EMBEDDING_USE_GPU:-false}
      REC_BATCH_SIZE: ${REC_BATCH_SIZE:-64}
      MAX_BATCH_IMAGES: ${MAX_BATCH_IMAGES:-32}
      # 剪辑域：Chinese-CLIP 双塔。模型文件缺失时服务照常启动（clip_loaded=false），
      # 人脸功能不受影响。导出方法见 docs/media-edit.md。
      CLIP_MODEL_DIR: /opt/clip
      CLIP_MODEL_NAME: ${CLIP_MODEL_NAME:-chinese-clip-vit-b-16}
      CLIP_MODEL_VERSION: ${CLIP_MODEL_VERSION:-1}
      LOG_LEVEL: ${LOG_LEVEL}
    volumes:
      # CLIP 模型文件（image.onnx / text.onnx / vocab.txt）从宿主机挂入，
      # 不打进镜像 —— 它是可选能力，且换模型不应该要求重建镜像。
      - ${CLIP_MODEL_DIR_HOST:-./clip-model}:/opt/clip:ro
    expose:
      - "8000"
    # 推理是 CPU 密集的，限额避免它把整台机器吃满导致 api 无响应
    deploy:
      resources:
        limits:
          cpus: "${EMBEDDING_CPU_LIMIT:-4}"
          memory: 8g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=5).status==200 else 1)"]
      interval: 15s
      timeout: 10s
      retries: 5
      # 模型加载需要时间，给足启动期
      start_period: 90s

  api:
    image: ${IMAGE_PREFIX:-photo-gallery}-api:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    env_file: .env
    volumes:
      # 剪辑域：只读挂 output 分发成片 zip；agent-prompts 提示词热覆盖（可选）。
      # api 不挂 media —— 原片只有 jobs/worker 需要碰。
      - ${MEDIA_ROOT_HOST:-./photo-gallery-data}/output:/photo-gallery/output:ro
      - ${MEDIA_ROOT_HOST:-./photo-gallery-data}/agent-prompts:/photo-gallery/agent-prompts:ro
    # 数据库在宿主机上，容器里用 host.docker.internal 访问它。
    # host-gateway 由 docker 解析成宿主机在 docker0 网桥上的地址 ——
    # 前提是宿主机 pg 的 listen_addresses 和 pg_hba 放行了 docker 网段，
    # 见 docs/deployment.md 的「宿主机 Postgres」一节。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8000"
    depends_on:
      embedding:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=5).status==200 else 1)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  web:
    image: ${IMAGE_PREFIX:-photo-gallery}-web:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    restart: unless-stopped
    ports:
      # 生产环境前面还有一层反向代理负责 HTTPS，所以生产 .env 里
      # WEB_BIND=127.0.0.1 —— 只有本机的反向代理能连上这个端口。
      #
      # ⚠️ 这不只是「少开一个端口」：nginx.conf 里用 real_ip 信任了
      # X-Forwarded-For，一旦这个端口对外可达，客户端就能伪造它绕过限流。
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

  # 一次性容器：不随 `up` 启动，由 `docker compose run --rm jobs ...` 或 CI 触发
  jobs:
    image: ${IMAGE_PREFIX:-photo-gallery}-jobs:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: docker/Dockerfile.jobs
    profiles: ["tools"]
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # 迁移脚本从这里读，改 SQL 无需重建镜像
      - ./docs/schema:/app/docs/schema:ro
      # local_dir adapter 与评估集的输入目录
      - ${SOURCE_LOCAL_DIR:-./sample-albums}:/data/sample-albums:ro
      - ${EVAL_DIR:-./eval}:/data/eval:ro
      # 剪辑域专用盘：media/<album> 原片、output/<workspace> 成片、luts 滤镜导入目录。
      # 人脸建库的原图依旧不落盘 —— 这个卷只属于剪辑域。
      - ${MEDIA_ROOT_HOST:-./photo-gallery-data}:/photo-gallery
      # 原图不落盘：批量推理把字节留在内存里，处理完即释放。所以这里没有原图缓存卷。

  # 剪辑域常驻 worker：认领 job_run 队列（建库/解析检索/渲染/滤镜导入）。
  # 与 jobs 同一镜像，只是换了入口命令并常驻运行。
  worker:
    image: ${IMAGE_PREFIX:-photo-gallery}-jobs:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: docker/Dockerfile.jobs
    restart: unless-stopped
    command: ["python", "-m", "jobs", "worker"]
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      embedding:
        condition: service_healthy
    volumes:
      - ${MEDIA_ROOT_HOST:-./photo-gallery-data}:/photo-gallery
    # 拆条与渲染是 CPU 密集的，限额避免它把 api/embedding 挤死
    deploy:
      resources:
        limits:
          cpus: "${WORKER_CPU_LIMIT:-4}"
          memory: 6g
